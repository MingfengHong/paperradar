name: PaperRadar CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Compile
        run: python -m compileall -q paperradar
      - name: Test
        run: python -m pytest -q
      - name: Setup wizard smoke test
        run: |
          mkdir -p /tmp/paperradar-smoke
          cd /tmp/paperradar-smoke
          paperradar setup --non-interactive \
            --topic-name "Template Smoke Test" \
            --question "What papers are worth reading?" \
            --keywords "paper recommendation,llm" \
            --channel none \
            --enable-arxiv
          paperradar doctor
      - name: Doctor
        run: paperradar doctor
